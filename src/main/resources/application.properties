spring.application.name=UGCExample

# optional - не упадет, если не будет
# file - путь к файлу
# [.properties] - подсказка типа файла
spring.config.import=optional:file:src/main/resources/.env[.properties]

# настройка hibernate (при запуске - проверка соответствия модели данных схеме БД)
spring.jpa.hibernate.ddl-auto=validate

# настройка подключения к БД
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}