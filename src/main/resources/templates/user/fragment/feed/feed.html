<!DOCTYPE html>
<html lang="ru"  xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="feed" class="feed-layout">
        <aside class="feed-sidebar" th:replace="~{this::leftSidebar}"></aside>
        <main class="feed-content" th:replace="~{this::postsList}"></main>
        <aside class="feed-sidebar" th:replace="~{this::rightSidebar}"></aside>
    </div>

<!-- Заглушки   -->
    <aside th:fragment="leftSidebar" class="feed-sidebar">
        <div class="placeholder">
            <p>Здесь будут списки</p>
        </div>
    </aside>
    <main th:fragment="postsList" class="feed-content">
        <div class="placeholder">
            <p>Здесь будет список постов</p>
        </div>
    </main>
    <aside th:fragment="rightSidebar" class="feed-sidebar">
        <div class="placeholder">
            <p>Здесь будут списки</p>
        </div>
    </aside>


    <style>
        .feed-layout {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr) 240px;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 16px;
            box-sizing: border-box;
        }

        .feed-sidebar {
        }

        .feed-content {
            min-width: 0;
        }

        .placeholder {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            color: #888;
            background: #fafafa;
        }
    </style>

</body>
</html>
